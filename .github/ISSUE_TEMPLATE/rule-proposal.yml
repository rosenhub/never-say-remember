name: Rule proposal
description: Propose a new rule or a change to one of the 12
labels: [rule]
body:
  - type: textarea
    id: before
    attributes:
      label: Before
      description: A real response you got from an agent. Paste it exactly.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After
      description: What it should have said instead.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who does this help, in one sentence?
    validations:
      required: true
  - type: dropdown
    id: which
    attributes:
      label: Which rule does this change?
      options: ["1 Never ask do you remember", "2 Never say I already told you", "3 Answer a repeat the same way", "4 Don't correct harmless beliefs", "5 Redirect only for safety", "6 Present tense, short sentences", "7 One idea per message", "8 Use their name", "9 No quizzing", "10 Reassure first, inform second", "11 Never rush or stack questions", "12 When upset, stop informing", "New rule (say which one it replaces)"]
    validations:
      required: true
